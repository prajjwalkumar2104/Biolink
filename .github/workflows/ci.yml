name: BioLink CI Pipeline

# Trigger this pipeline on every push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: biolink-backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./biolink-backend
        run: npm install

      - name: Generate Prisma Client (Mock)
        working-directory: ./biolink-backend
        run: DATABASE_URL="postgresql://dummy" npx prisma generate

      - name: Compile TypeScript
        working-directory: ./biolink-backend
        run: npm run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: biolink-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./biolink-frontend
        run: npm install

      - name: Build Next.js
        working-directory: ./biolink-frontend
        run: npm run build